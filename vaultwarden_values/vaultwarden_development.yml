image:
  registry: docker.io
  repository: vaultwarden/server
  tag: "1.36.0-alpine"

replicas: 1

resources:
  requests:
    memory: 50Mi
    cpu: 50m
  limits:
    memory: 250Mi
    cpu: 200m

storage:
  data:
    name: "vaultwarden-data"
    size: 2Gi
    class: default
    path: "/data"
    keepPvc: false
    accessMode: "ReadWriteOnce"